<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solicitar acesso | IDG</title><style>:root{font-family:system-ui,sans-serif;color:#332348;background:#faf6fd}*{box-sizing:border-box}body{margin:0}header{background:#59328a;color:white;padding:20px}header a{color:white}main{max-width:600px;margin:30px auto;padding:0 16px}section{background:white;border:1px solid #e7d8f1;border-radius:18px;padding:24px}label{display:block;margin:16px 0 5px;font-weight:650}input{width:100%;padding:12px;border:1px solid #b8aac8;border-radius:9px;font:inherit}button{margin-top:18px;padding:13px 18px;border:0;border-radius:10px;background:#713eaa;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.6}p{line-height:1.6}#feedback{font-weight:600}</style></head><body><header><strong>IDG ✦ Área da Equipe</strong> · <a href="equipe.html">Voltar</a></header><main><h1>Solicitar acesso à coordenação</h1><section><p>Cadastre-se com seu próprio e-mail. Seu acesso às turmas só será liberado após aprovação do administrador geral.</p><form id="request-form"><label for="name">Nome completo</label><input id="name" autocomplete="name" minlength="3" required><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required><label for="password">Criar senha (mínimo de 12 caracteres)</label><input id="password" type="password" autocomplete="new-password" minlength="12" required><button id="submit" type="submit">Enviar solicitação</button></form><p id="feedback" role="status" aria-live="polite"></p><p>Já tem acesso aprovado? <a href="coordenacao.html">Entrar na coordenação</a>.</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="idg-staff-signup.js?v=1"></script></body></html>
